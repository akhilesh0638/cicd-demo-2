  frontend:
    name: Frontend Build

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker Build, Scan & Push

    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    permissions:
      contents: read

    env:
      AWS_REGION: ap-south-1
      ECR_BACKEND: ecommerce-backend
      ECR_FRONTEND: ecommerce-frontend

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: image
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:${{ steps.image.outputs.tag }} \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND }}:${{ steps.image.outputs.tag }} \
            ./frontend

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241

      - name: Scan backend image
        run: |
          trivy image \
            --severity MEDIUM,LOW,UNKNOWN \
            --exit-code 0 \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:${{ steps.image.outputs.tag }}

      - name: Scan frontend image
        run: |
          trivy image \
            --severity MEDIUM,LOW,UNKNOWN \
            --exit-code 0 \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND }}:${{ steps.image.outputs.tag }}

      - name: Push backend image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:${{ steps.image.outputs.tag }}

      - name: Push frontend image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND }}:${{ steps.image.outputs.tag }}


      - name: Update Kubernetes deployment with new images
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name ecommerce-dev-eks

          helm upgrade --install ecommerce \
            ./k8s/helm/ecommerce \
            --namespace ecommerce \
            --create-namespace \
            --set frontend.image.repository=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND }} \
            --set frontend.image.tag=${{ steps.image.outputs.tag }} \
            --set backend.image.repository=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }} \
            --set backend.image.tag=${{ steps.image.outputs.tag }}
