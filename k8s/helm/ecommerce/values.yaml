namespace: ecommerce

frontend:
  replicaCount: 2

  image:
    repository: ""
    tag: ""

  containerPort: 80

  service:
    port: 80

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

    limits:
      cpu: 250m
      memory: 256Mi


backend:
  replicaCount: 2

  image:
    repository: ""
    tag: ""

  containerPort: 8080

  service:
    port: 8080

  resources:
    requests:
      cpu: 250m
      memory: 512Mi

    limits:
      cpu: 500m
      memory: 1Gi


database:
  host: ""
  port: "3306"
  name: "ecommerce_db"
  username: ""
  password: ""


ingress:
  enabled: true

  className: alb

  host: infocontent.site

  certificateArn: ""

  scheme: internet-facing

  targetType: ip
